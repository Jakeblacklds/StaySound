apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

import java.util.Properties

group = 'expo.modules.karaokeview'
version = '1.0.0'

def readSecretProperty = { String key ->
    def prop = findProperty(key)
    if (prop != null && prop.toString().trim()) {
        return prop.toString().trim()
    }

    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { stream -> localProps.load(stream) }
        def localValue = localProps.getProperty(key)
        if (localValue != null && localValue.trim()) {
            return localValue.trim()
        }
    }

    def envValue = System.getenv(key)
    if (envValue != null && envValue.trim()) {
        return envValue.trim()
    }

    return ''
}

def escapeForBuildConfig = { String value ->
    value
        .replace('\\', '\\\\')
        .replace('"', '\\"')
}

def supabaseUrl = readSecretProperty('SUPABASE_URL')
if (!supabaseUrl) {
    supabaseUrl = 'https://ucrtwqwaaadgjoerhgwg.supabase.co'
}
def supabaseSecretKey = readSecretProperty('SUPABASE_SECRET_KEY')

android {
    namespace 'expo.modules.karaokeview'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        versionCode 1
        versionName '1.0.0'

        buildConfigField 'String', 'SUPABASE_URL', "\"${escapeForBuildConfig(supabaseUrl)}\""
        buildConfigField 'String', 'SUPABASE_SECRET_KEY', "\"${escapeForBuildConfig(supabaseSecretKey)}\""
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
