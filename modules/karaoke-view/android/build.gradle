apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.karaokeview'
version = '1.0.0'

android {
    namespace 'expo.modules.karaokeview'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        versionCode 1
        versionName '1.0.0'
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
