apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.karaokeview'
version = '1.0.0'

android {
    namespace 'expo.modules.karaokeview'
    testOptions { unitTests.returnDefaultValues = true }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        versionCode 1
        versionName '1.0.0'
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
